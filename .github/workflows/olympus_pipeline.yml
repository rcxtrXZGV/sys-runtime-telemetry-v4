name: Olympus Sovereign Multi-Agent Cloud Pipeline

on:
  schedule:
    # Runs periodically to assess market without rushing into noise (Every 30 minutes)
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  olympus-pipeline:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Quant & GenAI Dependencies
        run: |
          pip install MetaTrader5 requests google-genai

      - name: High-Speed Cache MT5 Runtime
        id: cache-mt5
        uses: actions/cache@v4
        with:
          path: |
            C:\MT5
            C:\Users\runneradmin\AppData\Roaming\MetaQuotes\Terminal\D0E8209F77C8CF37AD8BF550E51FF075
          key: titan-mt5-runtime-v1

      - name: 1-Time Restore MT5 if Cache Miss
        if: steps.cache-mt5.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $mt5ZipUrl = "https://github.com/rcxtrXZGV/TITAN-LLM-QUANT-BRAIN/releases/download/v1.0.0/mt5_portable.zip"
          $configZipUrl = "https://github.com/rcxtrXZGV/TITAN-LLM-QUANT-BRAIN/releases/download/v1.0.0/mt5_config.zip"
          $targetDir = "C:\MT5"
          $appdataDir = "$env:APPDATA\MetaQuotes\Terminal\D0E8209F77C8CF37AD8BF550E51FF075"
          
          Invoke-WebRequest -Uri $mt5ZipUrl -OutFile "$env:TEMP\mt5.zip"
          Expand-Archive -Path "$env:TEMP\mt5.zip" -DestinationPath $targetDir -Force
          
          Invoke-WebRequest -Uri $configZipUrl -OutFile "$env:TEMP\config.zip"
          New-Item -ItemType Directory -Force -Path $appdataDir | Out-Null
          Expand-Archive -Path "$env:TEMP\config.zip" -DestinationPath $appdataDir -Force

          Copy-Item -Path "$appdataDir\*" -Destination $targetDir -Recurse -Force

      - name: Step 1 - Convene Sovereign AI Council (8-Agent Syndicate)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python olympus_brain.py

      - name: Step 2 - Execute Sovereign AI Mandate on MT5
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          python olympus_executor.py

      - name: Step 3 - Commit AI Memory & Live Telemetry
        shell: bash
        run: |
          git config --global user.email "olympus-ai@quant.fund"
          git config --global user.name "Olympus-AI"
          git add brain_vault/
          git diff --staged --quiet || (git commit -m "olympus: sovereign telemetry & memory sync [skip ci]" && git push origin main)
